<!DOCTYPE html>
<!--
  NARMELA CAFFE — Digital QR Menu
  Single file: HTML + CSS + vanilla JS. Works on GitHub Pages (just upload as index.html).

  HOW TO EDIT
  1. Products   -> edit the PRODUCTS array in the <script> (search for "PRODUCTS").
  2. Categories -> edit CATEGORIES.
  3. Photos     -> set `img: "images/latte.jpg"` on a product, OR set CONFIG.photoDir = "images/" and
                   add images/<product id>.jpg (e.g. images/latte.jpg). No photo = the drawn picture.
  4. Texts      -> edit I18N (interface) and CONFIG (cafe info, currency).
  5. Availability -> set `available: false` on any product.
-->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NARMELA CAFFE</title>
<meta name="theme-color" content="#78816A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23B96648'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' font-family='Georgia,serif' fill='%23161616'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============ 1. DESIGN TOKENS (change the colours here) ============ */
:root{
  --charcoal:#252321;        /* header, footer, main text */
  --cream:#F1E9DC;           /* page background */
  --terracotta:#B96648;      /* prices, selected states, primary buttons */
  --olive:#78816A;           /* secondary buttons, subtle details */
  --white:#FFFFFF;           /* product cards */
  --cream-deep:#E4D8C5;      /* hairlines, placeholders */
  --ink-soft:#6B635A;        /* secondary text */
  --radius:18px;
  --font-latin:"Cormorant Garamond","Times New Roman",serif;                 /* wordmark */
  --font-body:"DM Sans","Vazirmatn","Segoe UI",Tahoma,system-ui,sans-serif;  /* English */
  --font-fa:"Vazirmatn","DM Sans","Segoe UI",Tahoma,system-ui,sans-serif;    /* Persian */
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--cream);color:var(--charcoal);line-height:1.65;min-height:100vh;overflow-x:clip}
html[lang="fa"] body{font-family:var(--font-fa)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
button:active,.btn:active{transform:scale(.97)}
a{color:inherit}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:3px;border-radius:8px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto;position:relative}
#menu,#visit{scroll-margin-top:200px}

/* ============ 2. HEADER ============ */
.masthead{background:var(--charcoal);color:var(--cream);padding-top:env(safe-area-inset-top,0px);position:relative;overflow:hidden}
.masthead::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;border:1px solid rgba(120,129,106,.55);inset-inline-end:-80px;top:-120px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.wordmark{direction:ltr;font-family:var(--font-latin);font-weight:600;font-size:1.3rem;letter-spacing:.2em;text-decoration:none;white-space:nowrap}
.wordmark span{color:var(--terracotta);font-size:.78em;letter-spacing:.34em}
.nav{display:none;gap:28px;margin-inline-start:auto;margin-inline-end:22px}
.nav a{font-size:.88rem;text-decoration:none;opacity:.75;padding:4px 0;border-bottom:1px solid transparent;transition:opacity .25s,border-color .25s}
.nav a:hover{opacity:1;border-color:var(--terracotta)}
.bar-end{display:flex;align-items:center;gap:8px}
.pin{width:36px;height:36px;border-radius:50%;border:1px solid rgba(241,233,220,.3);display:grid;place-items:center;transition:background .25s}
.pin svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pin:hover,.lang-btn:hover{background:var(--terracotta);border-color:var(--terracotta)}
.lang-btn{min-width:52px;height:36px;padding:0 14px;border:1px solid rgba(241,233,220,.3);border-radius:99px;font-size:.85rem;font-weight:500;letter-spacing:.04em;transition:background .25s,border-color .25s,transform .15s}
.hero{padding:2px 0 24px}
.tagline{position:relative;padding-top:14px;max-width:32ch;font-size:clamp(1.05rem,4.2vw,1.4rem);font-weight:300;line-height:1.5}
.tagline::before{content:"";position:absolute;top:0;inset-inline-start:0;width:34px;height:2px;background:var(--terracotta)}
@media (max-width:380px){.wordmark{font-size:1.1rem;letter-spacing:.14em}.wordmark span{letter-spacing:.22em}.bar{gap:8px}}

/* ============ 3. SEARCH + CATEGORY CARDS ============ */
.controls{position:sticky;top:0;z-index:20;background:rgba(241,233,220,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px) + 12px) 0 8px;border-bottom:1px solid transparent;transition:border-color .3s}
.controls.stuck{border-color:var(--cream-deep)}
@media (max-height:699px){.controls{position:static}}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:16px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--ink-soft);pointer-events:none;transition:color .25s}
.search:focus-within svg{color:var(--terracotta)}
.search input{width:100%;height:48px;border-radius:99px;border:1px solid var(--cream-deep);background:var(--white);padding-inline:46px;font-size:.96rem;transition:border-color .25s,box-shadow .25s;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#9A9082}
.search input:focus{outline:none;border-color:var(--terracotta);box-shadow:0 0 0 4px rgba(185,102,72,.14)}
.search input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;inset-inline-end:9px;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:50%;background:var(--cream);font-size:1rem;line-height:1;display:none}
.clear.show{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;width:82px;min-height:84px;padding:9px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:16px;border:1px solid var(--cream-deep);background:#FAF5EB;color:var(--charcoal);font-size:.7rem;line-height:1.35;text-align:center;transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),transform .15s}
.chip i{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--cream);transition:background .25s var(--ease)}
.chip svg{width:20px;height:20px;fill:none;stroke:var(--olive);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.chip span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--terracotta);border-color:var(--terracotta);color:var(--white);font-weight:600}
.chip[aria-pressed="true"] i{background:rgba(255,255,255,.2)}
.chip[aria-pressed="true"] svg{stroke:var(--white)}
@media (hover:hover){.chip:not([aria-pressed="true"]):hover{border-color:var(--olive)}}
.options{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 0;font-size:.82rem;color:var(--ink-soft)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--charcoal)}
.switch .track{width:34px;height:20px;border-radius:99px;background:var(--cream-deep);position:relative;transition:background .25s}
.switch .track::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:var(--white);transition:inset-inline-start .25s var(--ease)}
.switch[aria-pressed="true"] .track{background:var(--olive)}
.switch[aria-pressed="true"] .track::after{inset-inline-start:17px}

/* ============ 4. MENU: editorial headings + product cards ============ */
main{padding:6px 0 56px}
.category{margin-top:30px}
.cat-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.cat-head h2{font-size:clamp(1.35rem,5vw,1.8rem);font-weight:600;line-height:1.25}
.cat-head span{font-size:.8rem;font-weight:300;color:var(--ink-soft);white-space:nowrap}
.cat-head::after{content:"";flex:1;height:1px;background:var(--cream-deep);align-self:center;order:3}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.item{display:flex;flex-direction:column;background:var(--white);border-radius:var(--radius);overflow:hidden;animation:rise .45s var(--ease) both;animation-delay:calc(min(var(--i,0),12) * 35ms);transition:transform .3s var(--ease)}
.thumb{aspect-ratio:1/1;width:100%;background:var(--cream-deep);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.thumb:not(.ld)::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600;font-size:.98rem;line-height:1.4}
.desc{font-size:.8rem;font-weight:300;line-height:1.55;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{margin-top:auto;padding-top:8px;color:var(--terracotta);font-weight:600;font-size:1.05rem;white-space:nowrap}
.price small{font-size:.72rem;font-weight:400;color:var(--ink-soft);margin-inline-start:4px}
.badge{position:absolute;z-index:2;inset-block-start:10px;inset-inline-start:10px;padding:2px 12px;border-radius:99px;font-size:.72rem;font-weight:500;background:var(--charcoal);color:var(--cream)}
.item.off .thumb img{filter:grayscale(1);opacity:.5}
.item.off .name,.item.off .desc,.item.off .price{color:#8C857A}
@media (hover:hover){.item:hover{transform:translateY(-4px)}.item:hover .thumb img{transform:scale(1.05)}}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.info{padding:14px 16px 16px}.name{font-size:1.04rem}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{display:flex}.pin{display:none}.wordmark{font-size:1.5rem}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (min-width:640px){.nav{display:flex}.pin{display:none}}

/* ============ 5. EMPTY STATE ============ */
.empty{text-align:center;padding:56px 12px 40px;animation:rise .5s var(--ease) both}
.empty .cup{width:92px;height:92px;margin:0 auto 18px;display:block}
.empty h3{font-size:1.2rem;font-weight:600}
.empty p{color:var(--ink-soft);font-size:.92rem;margin:6px auto 20px;max-width:30ch}
.empty button{height:44px;padding:0 24px;border-radius:99px;background:var(--charcoal);color:var(--cream);font-size:.9rem;transition:background .25s,transform .15s}
.empty button:hover{background:var(--terracotta)}

/* ============ 6. CAFE INFORMATION ============ */
.visit{padding:10px 0 56px}
.visit h2{font-size:clamp(1.35rem,5vw,1.8rem);font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.visit h2::after{content:"";flex:1;height:1px;background:var(--cream-deep)}
.visit-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.box{background:var(--white);border-radius:var(--radius);padding:20px}
.box[hidden]{display:none}
.box-label{font-size:.78rem;color:var(--olive);font-weight:600;margin-bottom:6px}
.box p{font-size:.95rem}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;margin-top:14px;padding:0 22px;border-radius:99px;background:var(--terracotta);color:var(--white);text-decoration:none;font-size:.9rem;font-weight:500;text-align:center;transition:background .25s,color .25s,transform .15s}
.btn-row .btn{margin-top:0;flex:1 1 auto}
.btn:hover{background:#9f523a}
.btn.ghost{background:transparent;color:var(--charcoal);border:1px solid var(--olive)}
.btn.ghost:hover{background:var(--olive);color:var(--white)}
.btn svg{width:18px;height:18px;flex:none}
.phone{display:block;font-size:1.2rem;font-weight:500;text-decoration:none;unicode-bidi:plaintext}
.phone+.phone{margin-top:6px}

/* ============ 7. FOOTER ============ */
footer{background:var(--charcoal);color:var(--cream);padding:40px 0 calc(32px + env(safe-area-inset-bottom,0px));text-align:center;position:relative;overflow:hidden}
footer::before{content:"";display:block;width:34px;height:2px;background:var(--terracotta);margin:0 auto 22px}
footer .wordmark{display:inline-block;font-size:1.4rem}
footer p,footer a.f-insta{display:block;font-size:.85rem;font-weight:300;margin-top:8px;opacity:.85}
footer a.f-insta{text-decoration:none;direction:ltr;color:var(--cream)}
footer a.f-insta:hover{color:var(--terracotta);opacity:1}
footer .copy{margin-top:22px;font-size:.75rem;opacity:.55;direction:ltr}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ============ NARMELA MENU V4 — REFERENCE CARD REFINEMENT ============ */
.masthead{padding-bottom:4px}
.bar{height:58px}
.controls{padding-top:10px;background:rgba(241,233,220,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.chips{gap:9px;padding:10px 2px 8px}
.chip{width:76px;min-height:74px;padding:7px 5px 7px;gap:5px;border-radius:15px;background:rgba(255,255,255,.42)}
.chip i{width:30px;height:30px;border-radius:10px;background:rgba(120,129,106,.10)}
.chip svg{width:20px;height:20px}
.chip span{font-size:.69rem;line-height:1.3}
main{padding:8px 0 54px}
.category{margin-top:28px}
.cat-head{margin-bottom:15px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.item{
  min-width:0;
  min-height:330px;
  background:rgba(255,255,255,.52);
  border:1px solid #ded4c6;
  border-radius:19px;
  box-shadow:0 2px 5px rgba(37,35,33,.035);
  overflow:hidden;
}
.thumb{
  width:112px;
  height:112px;
  aspect-ratio:1;
  flex:none;
  margin:19px auto 7px;
  border-radius:50%;
  border:1px solid #e0d6c8;
  background:#f2ecdf;
  display:grid;
  place-items:center;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:5px;
  border-radius:50%;
  transition:transform .35s var(--ease);
}
.thumb:not(.ld)::before{display:none}
.info{
  padding:9px 12px 15px;
  text-align:center;
  align-items:center;
  gap:5px;
}
.name{font-size:.93rem;line-height:1.45;min-height:1.45em}
.subname{
  min-height:1.25em;
  font-family:var(--font-body);
  font-size:.73rem;
  line-height:1.35;
  color:#8a8278;
  direction:ltr;
  text-align:center;
}
.desc{
  min-height:2.9em;
  margin-top:2px;
  font-size:.73rem;
  line-height:1.6;
  -webkit-line-clamp:2;
  text-align:center;
}
.price{
  margin-top:auto;
  padding:7px 12px;
  border-radius:99px;
  background:rgba(120,129,106,.13);
  color:#69735d;
  font-size:.88rem;
  line-height:1.4;
}
.price small{color:#69735d;font-size:.69rem}
.badge{inset-block-start:8px;inset-inline-start:8px;font-size:.66rem}
.visit{padding-top:8px}
.box{
  border:1px solid rgba(222,212,198,.9);
  background:rgba(255,255,255,.55);
  box-shadow:0 2px 5px rgba(37,35,33,.03);
}
@media (min-width:560px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
  .item{min-height:350px}
  .thumb{width:120px;height:120px;margin-top:20px}
  .info{padding-inline:14px}
}
@media (min-width:960px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:19px}
  .item{min-height:355px}
}
@media (max-width:380px){
  .grid{gap:10px}
  .item{min-height:318px;border-radius:16px}
  .thumb{width:96px;height:96px;margin-top:15px}
  .info{padding-inline:9px}
  .name{font-size:.86rem}
  .subname{font-size:.68rem}
  .desc{font-size:.69rem}
  .price{font-size:.8rem;padding:6px 9px}
}


/* ============ NARMELA ENTRY GATE — PISTACHIO GLASS ============ */
.entry-screen[hidden],#siteContent[hidden]{display:none!important}
.entry-screen{
  min-height:100svh; min-height:100vh; width:100%; position:relative; isolation:isolate;
  display:grid; place-items:center; overflow:hidden; padding:28px 18px;
  background:
    radial-gradient(ellipse at 50% 12%, rgba(174,190,145,.42), transparent 44%),
    radial-gradient(ellipse at 8% 85%, rgba(120,129,106,.22), transparent 38%),
    linear-gradient(145deg,#252a22 0%,#414a38 36%,#dce1cf 72%,#f1e9dc 100%);
}
.entry-screen::before,.entry-screen::after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.entry-screen::before{width:min(78vw,620px);aspect-ratio:1;inset-inline-start:-24%;top:-25%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 32px rgba(255,255,255,.025),0 0 0 70px rgba(255,255,255,.02)}
.entry-screen::after{width:min(70vw,520px);aspect-ratio:1;inset-inline-end:-22%;bottom:-30%;background:rgba(210,220,190,.15);filter:blur(4px)}
.entry-glow{position:absolute;border-radius:50%;filter:blur(55px);z-index:-1;pointer-events:none}
.entry-glow-one{width:260px;height:260px;top:8%;inset-inline-end:8%;background:rgba(184,199,154,.25)}
.entry-glow-two{width:300px;height:300px;bottom:2%;inset-inline-start:2%;background:rgba(241,233,220,.28)}
.entry-card{
  width:min(100%,490px); min-height:560px; padding:46px 34px 30px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; border-radius:34px; position:relative; overflow:hidden;
  color:#252a22; background:linear-gradient(145deg,rgba(255,255,255,.64),rgba(247,246,235,.34));
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(120,129,106,.12),0 28px 80px rgba(20,28,18,.24);
  -webkit-backdrop-filter:blur(28px) saturate(145%);backdrop-filter:blur(28px) saturate(145%);
}
.entry-card::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.38);border-radius:27px;pointer-events:none}
.entry-mark{width:104px;height:104px;border-radius:32px;display:grid;place-items:center;color:#4f6047;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(222,231,207,.62));border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 30px rgba(46,60,38,.12),inset 0 1px 0 white;margin-bottom:18px}
.entry-mark svg{width:70px;height:70px}
.entry-brand{font-family:var(--font-latin);font-size:1.55rem;font-weight:600;letter-spacing:.22em;direction:ltr;line-height:1.2}
.entry-brand span{color:#78816a;font-size:.72em;letter-spacing:.28em}
.entry-kicker{font-size:.68rem;letter-spacing:.34em;font-weight:600;color:#69735d;margin-top:12px}
.entry-slogan{font-family:var(--font-latin);font-size:1.5rem;line-height:1.25;font-weight:600;color:#353b30;margin-top:31px}
.entry-slogan-fa{font-size:1.02rem;font-weight:600;color:#505b47;margin-top:9px;line-height:1.9}
.entry-button{width:100%;min-height:62px;margin-top:36px;padding:10px 18px;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;background:linear-gradient(135deg,#788b68,#5e7052);border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 28px rgba(74,94,61,.25),inset 0 1px 0 rgba(255,255,255,.35);font-size:.98rem;font-weight:700;transition:transform .2s,box-shadow .2s,filter .2s}
.entry-button:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 16px 32px rgba(74,94,61,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.entry-button:active{transform:scale(.98)}
.entry-button-icon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28)}
.entry-button-icon svg{width:21px;height:21px}
.entry-arrow{font-size:1.2rem;opacity:.85}
.entry-footnote{font-size:.62rem;letter-spacing:.28em;color:#74806a;margin-top:26px;font-weight:600}
@media(max-width:480px){
 .entry-screen{padding:18px 16px}

/* =====================================================================
   6. STATE & HELPERS
   ===================================================================== */
const state = { lang: CONFIG.defaultLang, query: "", cat: "all", onlyAvail: false };
const $ = id => document.getElementById(id);
const els = {
  menu: $("menu"), chips: $("chips"), search: $("search"), clear: $("clear"),
  count: $("count"), langBtn: $("langBtn"), avail: $("availSwitch"), controls: $("controls")
};

// Restore saved language (safe if storage is blocked)
try { const s = localStorage.getItem("narmela-lang"); if (s === "fa" || s === "en") state.lang = s; } catch (e) {}

const t = key => I18N[state.lang][key];

// Escape text before inserting into HTML
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// Normalise text so Persian/Arabic letter variants and case don't break search
const norm = s => String(s).toLowerCase()
  .replace(/ي/g, "ی").replace(/ك/g, "ک")
  .replace(/[\u064B-\u065F\u0670\u200c]/g, "")   // diacritics + ZWNJ
  .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
  .trim();

const formatPrice = n => new Intl.NumberFormat(state.lang === "fa" ? "fa-IR" : "en-US").format(n);
const formatCount = n => state.lang === "fa" ? I18N.fa.items(new Intl.NumberFormat("fa-IR").format(n)) : I18N.en.items(n);

/* =====================================================================
   7. FILTERING — search in both languages + category + availability
   ===================================================================== */
function getFiltered(){
  const q = norm(state.query);
  return PRODUCTS.filter(p => {
    if (state.cat !== "all" && p.cat !== state.cat) return false;
    if (state.onlyAvail && !p.available) return false;
    if (!q) return true;
    const hay = norm([p.name.fa, p.name.en, p.desc.fa, p.desc.en].join(" "));
    return hay.includes(q);
  });
}

// Show each category from lowest to highest price (items without a price go last)

  const list = [{ id: "all", label: t("all") }, ...CATEGORIES.map(c => ({ id: c.id, label: c[state.lang] }))];
  els.chips.innerHTML = list.map(c =>
    `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${state.cat === c.id}"><i><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[c.id]}</svg></i><span>${esc(c.label)}</span></button>`
  ).join("");
  markChips(false);
}
// Highlight the selected card without rebuilding the row (keeps the scroll position) and centre it
function markChips(smooth = true){
  let on = null;
  els.chips.querySelectorAll(".chip").forEach(b => { const is = b.dataset.cat === state.cat; b.setAttribute("aria-pressed", String(is)); if (is) on = b; });
  if (!on) return;
  const a = on.getBoundingClientRect(), c = els.chips.getBoundingClientRect();
  els.chips.scrollBy({ left: (a.left + a.width / 2) - (c.left + c.width / 2), behavior: smooth ? "smooth" : "auto" });
}

function itemHTML(p, i){
  const lang = state.lang;
  const src = p.img ? esc(p.img) : CONFIG.photoDir ? esc(CONFIG.photoDir + p.id + ".jpg") : placeholderSrc(p.art);
  const fallback = placeholderSrc(p.art);
  const price = p.price == null ? "" : `<div class="price">${formatPrice(p.price * CONFIG.priceUnit)}<small>${esc(CONFIG.currency[lang])}</small></div>`;
  return `
  <article class="item ${p.available ? "" : "off"}" style="--i:${i}">
    <div class="thumb"><img src="${src}" alt="${esc(p.name[lang])}" loading="lazy" width="400" height="400" onload="this.parentNode.classList.add('ld')" onerror="this.onerror=null;this.src='${fallback}'">${p.available ? "" : `<span class="badge">${esc(t("unavailable"))}</span>`}</div>
    <div class="info">
      <h3 class="name">${esc(p.name[lang])}</h3>
      <p class="subname" lang="${lang === "fa" ? "en" : "fa"}" dir="${lang === "fa" ? "ltr" : "rtl"}">${esc(p.name[lang === "fa" ? "en" : "fa"])}</p>
      <p class="desc">${esc(p.desc[lang])}</p>
      ${price}
    </div>
  </article>`;
}

function renderMenu(){
  const results = getFiltered();
  els.count.textContent = formatCount(results.length);

  // Elegant empty state
  if (!results.length){
    els.menu.innerHTML = `
      <div class="empty">
        <svg class="cup" viewBox="0 0 120 120" aria-hidden="true">
          <rect width="120" height="120" rx="60" fill="#E4ECD6"/>${ART.cup}
        </svg>
        <h3>${esc(t("emptyTitle"))}</h3>
        <p>${esc(t("emptyText"))}</p>
        <button type="button" id="resetBtn">${esc(t("reset"))}</button>
      </div>`;
    $("resetBtn").addEventListener("click", resetFilters);
    return;
  }

  // Group by category (keeps CATEGORIES order)
  let counter = 0;
  els.menu.innerHTML = CATEGORIES.map(cat => {
    const items = sortByPrice(results.filter(p => p.cat === cat.id));
    if (!items.length) return "";
    return `
    <section class="category" aria-labelledby="h-${cat.id}">
      <div class="cat-head"><h2 id="h-${cat.id}">${esc(cat[state.lang])}</h2><span>${esc(formatCount(items.length))}</span></div>
      <div class="grid">${items.map(p => itemHTML(p, counter++)).join("")}</div>
    </section>`;
  }).join("");
}

// Apply language to all static texts + direction
function applyLanguage(){
  const L = I18N[state.lang];
  document.documentElement.lang = state.lang;
  document.documentElement.dir = L.dir;
  document.body.style.fontFamily = ""; // font stack handles both scripts
  els.langBtn.textContent = L.toggle;
  els.langBtn.setAttribute("aria-label", L.toggleLabel);
  els.search.placeholder = L.search;
  els.search.setAttribute("aria-label", L.search);
  els.clear.setAttribute("aria-label", L.clear);
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = L[el.dataset.i18n]);
  $("hours").textContent = CONFIG.hours[state.lang];
  $("copy").textContent = "© " + new Date().getFullYear() + " NARMELA CAFFE";
  $("address").textContent = CONFIG.address[state.lang];
  $("visitAddress").textContent = CONFIG.address[state.lang];
  $("phoneBox").hidden = !CONFIG.phones.length;
  $("phoneList").innerHTML = CONFIG.phones.map(n => `<a class="phone" href="tel:${esc(n.replace(/\s/g, ""))}">${esc(n)}</a>`).join("");
  document.title = "NARMELA CAFFE — " + (state.lang === "fa" ? "منو" : "Menu");
  renderChips();
  renderMenu();
}

function resetFilters(){
  state.query = ""; state.cat = "all"; state.onlyAvail = false;
  els.search.value = ""; els.clear.classList.remove("show");
  els.avail.setAttribute("aria-pressed", "false");
  markChips(); renderMenu();
}

/* =====================================================================
   9. EVENTS
   ===================================================================== */
els.langBtn.addEventListener("click", () => {
  state.lang = state.lang === "fa" ? "en" : "fa";
  try { localStorage.setItem("narmela-lang", state.lang); } catch (e) {}
  applyLanguage();
});

els.search.addEventListener("input", e => {
  state.query = e.target.value;
  els.clear.classList.toggle("show", !!state.query);
  renderMenu();
});
els.clear.addEventListener("click", () => {
  els.search.value = ""; state.query = ""; els.clear.classList.remove("show");
  renderMenu(); els.search.focus();
});

els.chips.addEventListener("click", e => {
  const btn = e.target.closest(".chip"); if (!btn) return;
  state.cat = btn.dataset.cat;
  markChips(); renderMenu();
  window.scrollTo({ top: Math.max(0, els.controls.offsetTop - 6), behavior: "smooth" });
});

els.avail.addEventListener("click", () => {
  state.onlyAvail = !state.onlyAvail;
  els.avail.setAttribute("aria-pressed", String(state.onlyAvail));
  renderMenu();
});

// Subtle divider under the sticky bar once the page is scrolled
const io = new IntersectionObserver(([en]) => els.controls.classList.toggle("stuck", !en.isIntersecting), { rootMargin: "-1px 0px 0px 0px", threshold: 1 });
const sentinel = document.createElement("div"); sentinel.style.height = "1px";
els.controls.before(sentinel); io.observe(sentinel);

/* =====================================================================
   10. START
   ===================================================================== */
const enterCafeButton = $("enterCafe");
enterCafeButton.addEventListener("click", () => {
  const gate = $("entryScreen");
  const content = $("siteContent");
  gate.hidden = true;
  content.hidden = false;
  window.scrollTo({ top: 0, behavior: "auto" });
});
$("gmapBtn").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.address.fa);
$("mapBtn").href = CONFIG.mapUrl; $("reviewsBtn").href = CONFIG.mapUrl;
applyLanguage();
</script>
</body>
